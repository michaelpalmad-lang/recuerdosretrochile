plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.canaltv.app'
    compileSdk 34

    defaultConfig {
        applicationId 'cl.canaltv.app'
        minSdk 21
        targetSdk 34
        versionCode 6
        versionName '1.5'
    }

    signingConfigs {
        firma {
            storeFile file('firma.jks')
            storePassword 'recuerdos2026'
            keyAlias 'recuerdos'
            keyPassword 'recuerdos2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firma fija: permite actualizar la app sin desinstalar
            signingConfig signingConfigs.firma
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Evita choques de versiones de Kotlin entre bibliotecas
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.mediarouter:mediarouter:1.6.0'
    // Chromecast
    implementation 'com.google.android.gms:play-services-cast-framework:21.4.0'
}
