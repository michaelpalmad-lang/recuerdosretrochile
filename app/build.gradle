plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.canaltv.app'
    compileSdk 34

    defaultConfig {
        applicationId 'cl.canaltv.app'
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName '1.4'
    }

    signingConfigs {
        firma {
            storeFile file('firma.jks')
            storePassword 'recuerdos2026'
            keyAlias 'recuerdos'
            keyPassword 'recuerdos2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firma fija: permite actualizar la app sin desinstalar
            signingConfig signingConfigs.firma
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
